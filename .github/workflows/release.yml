# Nobody picks a version. release-please reads the Conventional Commits that
# land on main and keeps a release pull request open carrying the next
# version and the changelog entry; merging that pull request tags the
# release and writes the notes. This job then rebuilds the .deb against the
# tag that release just cut and attaches it.
#
# One workflow rather than two, because a tag pushed with GITHUB_TOKEN starts
# no further workflow run — GitHub refuses, to stop recursive runs. A
# separate on-tag workflow would silently never fire, and the first symptom
# is a release with no package on it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never two releases at once, and never cancel one halfway: a killed run can
# leave a tag pushed and nothing published against it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Works out what, if anything, is being released. Most runs only refresh
  # the release pull request; the run that matters is the one where that
  # pull request was what just landed.
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tags the release and writes it
      pull-requests: write # keeps the release pull request up to date
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artefacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attaches the .deb to the release
      id-token: write # mints the Sigstore OIDC token the attestation is signed with
      attestations: write # publishes the attestation to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the branch: debian/changelog's version has to match
          # what release-please just cut, and that's only true on the tag.
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build and lint the package
        run: ./scripts/build-deb.sh

      # SLSA Build L2: a signed, Sigstore-backed attestation tying this exact
      # file to this workflow run. Provenance, not signing — the .deb itself
      # isn't cosign-signed, a separate decision left for whenever a real
      # consumer verifies one.
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.deb"

      - name: Attach to the release
        run: gh release upload "$TAG" dist/*.deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
